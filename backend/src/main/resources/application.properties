# Configuracao local: banco em arquivo, sem depender de PostgreSQL para iniciar.
spring.datasource.url=jdbc:h2:file:./data/dentic;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
server.port=8080
dentic.jwt.secret=${DENTIC_JWT_SECRET}
dentic.frontend.url=${DENTIC_FRONTEND_URL:http://localhost:5173}
dentic.cookie.secure=${COOKIE_SECURE:true}
dentic.webhooks.whatsapp.secret=${WHATSAPP_WEBHOOK_SECRET:}
dentic.webhooks.billing.secret=${BILLING_WEBHOOK_SECRET:}
